name: Update RWHA Standings

# Manual-only. The scheduled run is now nightly-update.yml (midnight Pacific),
# which runs rosters → NHL stats → standings in one go.
# Use "Run workflow" in the Actions tab to run just this step on demand.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-standings:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Scrape RWHA schedule and update STANDINGS in index.html
        run: python .github/scripts/update_standings.py

      - name: Commit and push if standings changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if git diff --quiet index.html; then
            echo "index.html unchanged — nothing to commit."
          else
            git add index.html
            git commit -m "Auto-update RWHA standings [${STANDINGS_DATE}]"
            git push
          fi
