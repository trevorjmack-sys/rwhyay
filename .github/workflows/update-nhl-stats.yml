name: Update NHL Stats

# Manual-only. The scheduled run is now nightly-update.yml (midnight Pacific),
# which runs rosters → NHL stats → standings in one go.
# Use "Run workflow" in the Actions tab to run just this step on demand.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch current-season NHL stats and update nhl_stats.js
        run: python .github/scripts/update_nhl_stats.py

      - name: Commit and push if stats changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add nhl_stats.js nhl_stats_prev.js
          if git diff --cached --quiet; then
            echo "nhl_stats.js unchanged - nothing to commit."
          else
            git commit -m "Auto-update NHL stats [$(date -u '+%Y-%m-%d')] - NHL ${NHL_LABEL} ${NHL_MATCHED}/${NHL_TOTAL} players"
            git push
          fi
